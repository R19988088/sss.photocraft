[package]
name = "procraft-gpu"
version = "0.24.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"
description = "ProCraft's GPU renderer (wgpu, vendored verbatim from artcraft-android/procraft): layer pixels, stroke rendering, compositing and presenting the canvas"

[dependencies]
procraft-engine = { path = "../procraft-engine" }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "dx12", "wgsl", "naga-ir"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
log = "0.4"
thiserror = "2"

# OpenGL ES where a device's Vulkan is missing or can't make a device
[target.'cfg(target_os = "android")'.dependencies]
wgpu = { version = "30", features = ["gles"] }

# OpenGL on Windows where neither Vulkan nor Direct3D 12 makes a device (an older GPU or driver)
[target.'cfg(windows)'.dependencies]
wgpu = { version = "30", features = ["gles"] }

# OpenGL on Linux where Vulkan makes no device (an older GPU or driver)
[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30", features = ["gles"] }

# Metal on Apple's systems (the iPad app's core, the Mac's desktop app)
[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { version = "30", features = ["metal"] }
