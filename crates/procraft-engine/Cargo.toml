[package]
name = "procraft-engine"
version = "0.24.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"
description = "ProCraft's painting engine (vendored verbatim from artcraft-android/procraft): document model, brushes, stroke geometry and the canvas view. No GPU, no platform code."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"
